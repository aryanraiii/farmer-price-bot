# render.yaml — Render Blueprint for auto-configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: farmer-price-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: KAPSO_API_KEY
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: PORT
        value: 3000
