# render.yaml — Render Blueprint for auto-configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: farmer-price-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: PORT
        value: 3000
