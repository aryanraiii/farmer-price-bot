# render.yaml — Render Blueprint for auto-configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: farmer-price-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: META_VERIFY_TOKEN
        value: my_secret_verify_token_123
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: PORT
        value: 3000
