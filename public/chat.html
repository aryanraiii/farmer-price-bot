<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandi Price Bot — WhatsApp Chat</title>
<style>
  /* ─── Reset & Base ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #111b21;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── Chat Container ─── */
  .chat-container {
    width: 100%;
    max-width: 520px;
    height: 95vh;
    max-height: 750px;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  /* ─── Header ─── */
  .chat-header {
    background: #202c33;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #2a3942;
  }
  .chat-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #00a884;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    flex-shrink: 0;
  }
  .chat-header-info h2 {
    font-size: 16px;
    font-weight: 500;
    color: #e9edef;
  }
  .chat-header-info span {
    font-size: 12px;
    color: #00a884;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 18px;
    color: #aebac1;
    font-size: 20px;
  }

  /* ─── Chat Body ─── */
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 24px 6px;
    background-color: #0b141a;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' patternUnits='userSpaceOnUse' width='60' height='60'%3E%3Cpath d='M30 5 L35 15 L30 10 L25 15Z' fill='%23111b21' opacity='0.5'/%3E%3Ccircle cx='10' cy='45' r='2' fill='%23111b21' opacity='0.4'/%3E%3Ccircle cx='50' cy='35' r='1.5' fill='%23111b21' opacity='0.3'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='60' height='60' fill='url(%23p)'/%3E%3C/svg%3E");
  }
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-thumb { background: #374045; border-radius: 3px; }

  /* ─── Message Bubbles ─── */
  .message-row {
    display: flex;
    margin-bottom: 4px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message-row.user { justify-content: flex-end; }
  .message-row.bot  { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 7px 10px 6px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    position: relative;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .message-row.user .bubble {
    background: #005c4b;
    color: #e9edef;
    border-top-right-radius: 0;
  }
  .message-row.bot .bubble {
    background: #202c33;
    color: #e9edef;
    border-top-left-radius: 0;
    border: 1px solid #2a3942;
  }
  .bubble .timestamp {
    display: block;
    text-align: right;
    font-size: 11px;
    color: rgba(233,237,239,0.45);
    margin-top: 3px;
  }
  .message-row.user .bubble .timestamp { color: rgba(233,237,239,0.5); }

  /* ─── Typing Indicator ─── */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing-indicator .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #8696a0;
    animation: bounce 1.3s infinite ease-in-out;
  }
  .typing-indicator .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%           { transform: translateY(-6px); opacity: 1; }
  }

  /* ─── Date Divider ─── */
  .date-divider {
    text-align: center;
    margin: 12px 0;
  }
  .date-divider span {
    background: #182229;
    color: #8696a0;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 7px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.13);
  }

  /* ─── Input Bar ─── */
  .chat-input-bar {
    background: #202c33;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid #2a3942;
  }
  .emoji-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #8696a0;
    flex-shrink: 0;
    padding: 4px;
  }
  .emoji-btn:hover { color: #aebac1; }
  #messageInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    background: #2a3942;
    color: #e9edef;
  }
  #messageInput::placeholder { color: #8696a0; }
  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #00a884;
    color: #111b21;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .send-btn:hover { background: #06cf9c; }
  .send-btn:active { transform: scale(0.95); }

  /* ─── Responsive ─── */
  @media (max-width: 560px) {
    .chat-container {
      max-width: 100%;
      height: 100vh;
      max-height: none;
      border-radius: 0;
    }
    body { background: #0b141a; }
  }

  /* ─── Bold text (WhatsApp-style *text*) ─── */
  .bubble b { font-weight: 600; }

  /* ─── Nav link ─── */
  .dashboard-link {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 12px;
    color: #8696a0;
    text-decoration: none;
    opacity: 0.6;
  }
  .dashboard-link:hover { opacity: 1; color: #00a884; }
</style>
</head>
<body>

<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">🌾</div>
    <div class="chat-header-info">
      <h2>Mandi Price Bot</h2>
      <span>Agmarknet-powered · online</span>
    </div>
    <div class="header-actions">
      <span title="Search">🔍</span>
      <span title="Menu">⋮</span>
    </div>
  </div>

  <!-- Chat Body -->
  <div class="chat-body" id="chatBody">
    <div class="date-divider"><span>Today</span></div>
  </div>

  <!-- Input Bar -->
  <div class="chat-input-bar">
    <button class="emoji-btn" title="Emoji">😊</button>
    <input
      type="text"
      id="messageInput"
      placeholder="Type a message, e.g. 'onion nashik'"
      autocomplete="off"
    />
    <button class="send-btn" id="sendBtn" title="Send">
      <!-- Paper plane SVG icon -->
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.239 1.816-13.239 1.818-.011 7.911z"/>
      </svg>
    </button>
  </div>
</div>

<a href="/" class="dashboard-link">← Dashboard</a>

<script>
const chatBody   = document.getElementById('chatBody');
const input      = document.getElementById('messageInput');
const sendBtn    = document.getElementById('sendBtn');

// ─── Helpers ───
function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatReply(text) {
  // Convert WhatsApp-style *bold* to <b> and _italic_ to <i>
  return text
    .replace(/\*(.*?)\*/g, '<b>$1</b>')
    .replace(/_(.*?)_/g, '<i>$1</i>');
}

function scrollToBottom() {
  chatBody.scrollTop = chatBody.scrollHeight;
}

// ─── Add a message bubble ───
function addMessage(text, sender) {
  const row = document.createElement('div');
  row.className = `message-row ${sender}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatReply(text) + `<span class="timestamp">${getTime()}</span>`;

  row.appendChild(bubble);
  chatBody.appendChild(row);
  scrollToBottom();
  return row;
}

// ─── Show typing indicator ───
function showTyping() {
  const row = document.createElement('div');
  row.className = 'message-row bot';
  row.id = 'typing-row';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `
    <div class="typing-indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  `;

  row.appendChild(bubble);
  chatBody.appendChild(row);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

// ─── Send message ───
async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  // Add user bubble
  addMessage(text, 'user');
  input.value = '';
  input.focus();

  // Show typing indicator
  showTyping();

  // Random delay between 800-1200ms to simulate real latency
  const delay = 800 + Math.random() * 400;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await response.json();

    // Wait for the simulated typing delay before showing the reply
    await new Promise(resolve => setTimeout(resolve, delay));

    removeTyping();
    addMessage(data.reply, 'bot');
  } catch (err) {
    await new Promise(resolve => setTimeout(resolve, delay));
    removeTyping();
    addMessage('Sorry, having trouble right now — please try again.', 'bot');
  }
}

// ─── Event Listeners ───
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ─── Welcome message on load ───
window.addEventListener('load', () => {
  setTimeout(() => {
    addMessage(
      "Hi! 👋 I'm the *Mandi Price Bot*.\n\n" +
      "Send me a crop and district to get today's APMC price.\n\n" +
      "Try:\n• onion nashik\n• tomato pune\n• soybean latur",
      'bot'
    );
  }, 400);
  input.focus();
});
</script>
</body>
</html>
